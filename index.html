<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>內容確認系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f0e8;--bg2:#fdfaf4;--bg3:#ede8de;
  --ink:#17312C;--ink2:#2d4a44;--muted:#7a9e98;--line:#ddd7cc;
  --forest:#17312C;--forest2:#1a3832;--fl:#e4eeea;
  --flame:#F2735B;--flame2:#d9604a;--flame-l:#fdeee9;
  --red:#b5341a;--red-l:#fdecea;
  --blue:#1a5478;--blue-l:#e8f1f7;
  --gold:#c47c2a;
  --done:#1e6b42;--done-l:#e2f2ea;
  --mono:'Space Mono',ui-monospace,monospace;
  --serif:'Noto Serif TC',serif;
  --sans:'Noto Sans TC',sans-serif;
  --sh:0 2px 20px rgba(23,49,44,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;min-height:100vh}

/* ── TOP ── */
.top{background:var(--forest);color:#fff;height:58px;display:flex;align-items:center;gap:14px;padding:0 28px;position:sticky;top:0;z-index:300;box-shadow:0 2px 24px rgba(0,0,0,.28)}
.top-mark{width:34px;height:34px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.top-info{flex:1;min-width:0}
.top-info h1{font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-info p{font-family:var(--mono);font-size:9px;letter-spacing:.1em;opacity:.4;margin-top:1px;text-transform:uppercase}
.wall-btn{border:1px solid rgba(255,255,255,.22);background:transparent;color:rgba(255,255,255,.8);border-radius:8px;padding:7px 16px;font:700 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:.2s}
.wall-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.wall-btn:disabled{opacity:.25;cursor:not-allowed}
.wall-btn.on{background:var(--flame);border-color:var(--flame);color:#fff}

/* ── WRAP / CRUMBS ── */
.wrap{max-width:920px;margin:0 auto;padding:22px 18px}
.bc{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-bottom:22px;min-height:38px}
.crumb{display:flex;flex-direction:column;padding:5px 11px;border-radius:8px;transition:.15s;line-height:1.25;cursor:default}
.crumb small{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.crumb span{font-size:12px;font-weight:600;color:var(--ink)}
.crumb.cur{background:rgba(23,49,44,.1)}
.crumb.cur span{color:var(--forest)}
.crumb.lnk{cursor:pointer}
.crumb.lnk:hover{background:var(--fl)}
.crumb.lnk:hover small,.crumb.lnk:hover span{color:var(--forest)}
.csep{color:var(--line);font-size:18px;margin:0 -1px}

/* ── PANEL ── */
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:26px 24px;margin-bottom:16px}
.ptitle{font-family:var(--serif);font-size:24px;font-weight:900;color:var(--forest);letter-spacing:-.01em;margin-bottom:4px}
.psub{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:20px}

/* ── TILE GRID ── */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.tile{background:var(--bg2);border:1.5px solid var(--line);border-radius:13px;padding:20px 12px;text-align:center;cursor:pointer;transition:.2s;font-size:13px;font-weight:600;position:relative;overflow:hidden}
.tile::after{content:'';position:absolute;inset:0;background:var(--forest);opacity:0;transition:.2s;border-radius:11px}
.tile:hover::after{opacity:1}
.tile:hover{border-color:var(--forest);transform:translateY(-2px);box-shadow:0 8px 24px rgba(23,49,44,.18);color:#fff}
.tile-icon{font-size:26px;margin-bottom:10px;position:relative;z-index:1}
.tile b{position:relative;z-index:1;display:block}
.tcounts{display:flex;justify-content:center;gap:4px;margin-top:10px;flex-wrap:wrap;position:relative;z-index:1}
.tcounts span{font-size:10px;border-radius:999px;padding:2px 8px;font-weight:700;font-family:var(--mono)}
.cn{background:var(--flame-l);color:var(--flame)}
.cp{background:#eee;color:#777}
.cd{background:var(--done-l);color:var(--done)}

/* ── TYPE GRID ── */
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.type-btn{background:var(--bg2);border:1.5px solid var(--line);border-radius:16px;padding:32px 20px 24px;cursor:pointer;text-align:center;font-family:var(--sans);color:var(--ink);transition:.22s;position:relative;overflow:hidden}
.type-btn::before{content:'';position:absolute;inset:0;background:var(--forest);opacity:0;transition:.22s}
.type-btn:hover::before{opacity:1}
.type-btn:hover{border-color:var(--forest);transform:translateY(-2px);box-shadow:0 8px 28px rgba(23,49,44,.2);color:#fff}
.type-btn>*{position:relative;z-index:1}
.type-icon{font-size:40px;margin-bottom:12px;display:block}
.type-btn b{display:block;font-size:17px;font-weight:700;margin-bottom:5px}
.type-btn small{font-size:11px;opacity:.65}
.type-counts{display:flex;justify-content:center;gap:5px;margin-top:14px;flex-wrap:wrap}

/* ── TASK CARDS ── */
.task-card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
.task-card.prio{border-color:var(--flame);border-width:2px}
.task-card.prio .thead{border-left:3px solid var(--flame)}
.task-card.done-c{opacity:.7;border-style:dashed}
.thead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:13px 16px;cursor:pointer;user-select:none;transition:.13s}
.thead:hover{background:rgba(23,49,44,.03)}
.tid{font-family:var(--mono);font-size:10px;background:var(--bg3);color:#7a6a58;border-radius:6px;padding:3px 7px}
.persona{font-size:12px;color:var(--flame);font-weight:600}
.tgrow{flex:1}
.tdate{font-size:10px;color:var(--muted);font-family:var(--mono)}
.chev{font-size:16px;color:var(--muted);transition:transform .2s}
.task-card.open .chev{transform:rotate(90deg)}
.bdg{font-family:var(--mono);font-size:10px;border-radius:20px;padding:3px 10px;font-weight:700;white-space:nowrap;letter-spacing:.02em}
.b-need{background:var(--flame-l);color:var(--flame)}
.b-mod{background:var(--red-l);color:var(--red)}
.b-prog{background:#eee;color:#888}
.b-rev{background:var(--blue-l);color:var(--blue)}
.b-ok{background:var(--done-l);color:var(--done)}
.tbody{display:none;border-top:1px solid var(--line)}
.task-card.open .tbody{display:block}
.tinner{padding:18px}
.field{margin-bottom:14px}
.flabel{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}
.fval{white-space:pre-wrap;word-break:break-word;background:var(--bg3);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.7}
.fval.hi-f{background:var(--flame-l);border-left:3px solid var(--flame);border-radius:0 10px 10px 0}
.fval.hi-b{background:var(--blue-l);border-left:3px solid var(--blue);border-radius:0 10px 10px 0}
.imgs-row{display:flex;gap:10px;flex-wrap:wrap}
.img-th{width:100px;height:100px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer;background:#eee;flex-shrink:0}
.az{background:var(--bg3);border-top:1px solid var(--line);padding:16px}
.az-title{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
.avz{background:#edf3f7;border-top:1.5px dashed #c4d8e5;padding:16px}
.avz-title{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--blue);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:13px;padding:9px 12px;margin-bottom:10px;color:var(--ink);transition:.15s;appearance:auto}
select:focus,textarea:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 3px rgba(23,49,44,.1)}
textarea{min-height:86px;resize:vertical;line-height:1.65}
.btn{border:0;border-radius:10px;background:var(--forest);color:#fff;font:700 11px/1 var(--mono);padding:11px 22px;cursor:pointer;transition:.18s;letter-spacing:.05em;text-transform:uppercase}
.btn:hover{background:var(--forest2);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-blue{background:var(--blue)}.btn-blue:hover{background:#13405d}
.vlink{display:inline-flex;align-items:center;gap:8px;background:var(--blue-l);color:var(--blue);border-radius:9px;padding:9px 14px;font:700 11px/1 var(--mono);text-decoration:none;margin-bottom:10px}
.vlink:hover{background:#d0e5f0}
.done-div{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.done-div::after{content:'';flex:1;height:1px;background:var(--line)}

/* ── DASHBOARD ── */
.dash-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:0}
.dm{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:16px 18px}
.dm-label{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.dm-val{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--forest);line-height:1.1}
.dm-sub{font-size:11px;color:var(--muted);margin-top:3px}
.month-block{background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:var(--sh)}
.mhead{display:flex;align-items:center;gap:16px;padding:20px 24px;cursor:pointer;user-select:none;transition:.15s;position:relative}
.mhead::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--flame);border-radius:0 2px 2px 0;transform:scaleY(0);transition:.25s;transform-origin:bottom}
.month-block.open .mhead::before{transform:scaleY(1)}
.mhead:hover{background:rgba(23,49,44,.03)}
.m-label{font-family:var(--serif);font-size:21px;font-weight:900;color:var(--forest)}
.mpills{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.mpill{font-family:var(--mono);font-size:10px;font-weight:700;background:var(--bg3);color:var(--ink2);border-radius:999px;padding:4px 12px}
.mpill b{color:var(--forest)}
.mchev{font-size:16px;color:var(--muted);transition:transform .2s;margin-left:auto;flex-shrink:0}
.month-block.open .mchev{transform:rotate(90deg)}
.mbody{display:none;border-top:1px solid var(--line)}
.month-block.open .mbody{display:block}
.pt-wrap{overflow-x:auto}
.pt{width:100%;border-collapse:collapse;font-size:13px}
.pt th{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:12px 14px 8px;text-align:left;border-bottom:1px solid var(--line)}
.pt td{padding:11px 14px;border-bottom:1px solid rgba(0,0,0,.04);vertical-align:middle}
.prod-row{cursor:pointer;transition:.13s}
.prod-row:hover td,.prod-row.act td{background:var(--fl)}
.prod-row:last-of-type td{border-bottom:none}
.rank{font-family:var(--mono);font-size:12px;font-weight:700;width:24px;display:inline-block;text-align:center}
.r1{color:var(--flame);font-size:15px}.r2{color:var(--gold)}.r3{color:var(--muted)}
.bar-bg{background:var(--bg3);border-radius:3px;height:5px;overflow:hidden;width:80px;display:inline-block;vertical-align:middle}
.bar-fg{height:5px;background:var(--forest);border-radius:3px;min-width:3px}
.ptag{font-family:var(--mono);font-size:10px;background:var(--bg3);border-radius:6px;padding:3px 8px;color:var(--ink2);display:inline-block;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-n{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--forest)}
.fee-n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.pexp-tr{display:none}
.pexp-tr.open{display:table-row}
.pexp-td{padding:0;background:var(--fl)}
.mini-list{display:flex;flex-direction:column;gap:8px;padding:14px 16px}
.mini-card{background:var(--bg2);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.mini-head{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;transition:.13s}
.mini-head:hover{background:var(--bg3)}
.mini-body{display:none;border-top:1px solid var(--line);padding:14px;background:#fafaf6}
.mini-card.open .mini-body{display:block}
.mini-card.open .mc{transform:rotate(90deg)}
.mc{font-size:14px;color:var(--muted);transition:transform .2s}
.scr-txt{font-size:12px;line-height:1.7;color:var(--ink2);white-space:pre-wrap;word-break:break-word;max-height:100px;overflow:hidden}
.scr-txt.exp{max-height:none}
.scr-more{font-family:var(--mono);font-size:10px;color:var(--forest);cursor:pointer;text-decoration:underline;margin-top:4px;display:inline-block}
.mini-img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:#eee}
.mini-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mlink{font-family:var(--mono);font-size:10px;font-weight:700;padding:5px 11px;border-radius:7px;text-decoration:none}
.ml-post{background:var(--fl);color:var(--forest)}
.ml-video{background:var(--blue-l);color:var(--blue)}
.cpill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cpill.live{background:var(--done-l);color:var(--done)}
.cpill.stale{background:var(--flame-l);color:var(--flame)}
.cdot{width:6px;height:6px;border-radius:50%;background:currentColor}

.hidden{display:none!important}
.loader{padding:50px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.05em}
.empty{text-align:center;color:var(--muted);padding:44px;font-size:13px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:var(--forest);color:#fff;padding:11px 20px;border-radius:12px;opacity:0;transition:.22s;z-index:999;font:700 12px/1 var(--mono);max-width:88vw;text-align:center;letter-spacing:.03em}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;place-items:center;z-index:999;cursor:pointer}
.lb.show{display:grid}
.lb img{max-width:92vw;max-height:90vh;border-radius:10px}

@media(max-width:600px){
  .top{padding:0 14px}.wrap{padding:14px 12px}
  .dash-metrics{grid-template-columns:1fr 1fr}
  .dash-metrics .dm:nth-child(3){grid-column:span 2}
  .type-grid{grid-template-columns:1fr}
  .tgrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .pt th:nth-child(4),.pt td:nth-child(4){display:none}
  .mhead{padding:16px} textarea{min-height:72px}
}
</style>
</head>
<body>
<div class="top">
  <div class="top-mark">📋</div>
  <div class="top-info">
    <h1 id="appTitle">內容確認系統</h1>
    <p>Content Review Portal · QoooQ</p>
  </div>
  <button id="wallBtn" class="wall-btn" onclick="toggleWall()" disabled>數據牆</button>
</div>

<div class="wrap">
  <div id="bc" class="bc"></div>

  <section id="sClient" class="panel hidden">
    <div class="ptitle">選擇客戶</div><div class="psub">Select Client</div>
    <div id="clientGrid" class="tgrid"></div>
  </section>

  <section id="sMonth" class="panel hidden">
    <div class="ptitle">選擇月份</div><div class="psub">Select Month</div>
    <div id="monthGrid" class="tgrid"></div>
  </section>

  <section id="sProduct" class="panel hidden">
    <div class="ptitle">選擇商品</div><div id="prodSub" class="psub"></div>
    <div id="productGrid" class="tgrid"></div>
  </section>

  <section id="sType" class="panel hidden">
    <div class="ptitle">選擇內容類型</div><div id="typeSub" class="psub"></div>
    <div class="type-grid">
      <button class="type-btn" onclick="safeNav(()=>chooseType('thread'))">
        <span class="type-icon">🧵</span><b>脆（Threads）</b><small>短文・圖片・留言</small>
        <div class="type-counts" id="cntThread"></div>
      </button>
      <button class="type-btn" onclick="safeNav(()=>chooseType('video'))">
        <span class="type-icon">🎬</span><b>影音</b><small>腳本・畫面說明</small>
        <div class="type-counts" id="cntVideo"></div>
      </button>
    </div>
  </section>

  <section id="sTasks" class="panel hidden">
    <div id="taskTitle" class="ptitle"></div><div id="taskSub" class="psub"></div>
    <div id="taskList"></div>
  </section>

  <section id="sDash" class="hidden">
    <div class="panel" style="margin-bottom:14px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px">
        <div><div class="ptitle">數據牆</div><div id="dashSub" class="psub" style="margin-top:2px"></div></div>
        <div id="cachePill" style="margin-top:6px"></div>
      </div>
      <div id="dashMetrics" class="dash-metrics"></div>
    </div>
    <div id="dashBody"><div class="loader">載入數據中…</div></div>
  </section>
</div>

<div id="toast" class="toast"></div>
<div id="lb" class="lb" onclick="closeLB()"><img id="lbImg" alt=""></div>

<script>
/* ══════════════════════════════════════════
   CONFIG — 填入你的設定
══════════════════════════════════════════ */
const GAS='https://script.google.com/macros/s/AKfycbxBPxJSK_VPMQnPOfWvHTx2fkq9NgOgFegziTSPFiaS-J5-duSITKM8xdj7je6gDcE/exec';
const CACHE={
  spreadsheetId:'1KN763aASlO8s0H99xjvHd2Z4y8qYzQ_TPMS1uiyb3MU',
  sheetGid:'1848381448',
  enabled:true
};

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
const S={
  client:'',clientName:'',month:'',product:'',type:'',
  meta:null,cc:{},
  dashboard:null,dashLoading:false,dashReady:false,
  lastScene:'sMonth',cacheAt:''
};
const qs=new URLSearchParams(location.search);
const $=id=>document.getElementById(id);
let navLock=false,navSeq=0;

/* ══════════════════════════════════════════
   INIT — 確認 + 數據牆同時預載
══════════════════════════════════════════ */
(async()=>{
  S.client=qs.get('client')||'';
  if(!S.client) return loadClients();
  // 並行：loadMeta 和 prefetchDash 同時跑
  await Promise.all([loadMeta(), prefetchDash()]);
})();

/* ══════════════════════════════════════════
   GAS API
══════════════════════════════════════════ */
function gasAPI(action,params={}){
  const u=new URL(GAS);
  u.searchParams.set('action',action);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v??''));
  return fetch(u).then(r=>r.json()).then(d=>{if(d.ok===false)throw new Error(d.error||'err');return d;});
}

/* ══════════════════════════════════════════
   CACHE — 單列讀取（meta / counts）
══════════════════════════════════════════ */
function readCache(type,clientId,extra=''){
  return new Promise((res,rej)=>{
    if(!CACHE.enabled||!CACHE.spreadsheetId||!CACHE.sheetGid)return rej('no cfg');
    const cb='cc_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const key=extra?clientId+'|'+extra:clientId;
    const tq=`select D,E where A='${clientId}' and B='${type}' and C='${key}' limit 1`;
    const url=`https://docs.google.com/spreadsheets/d/${CACHE.spreadsheetId}/gviz/tq?gid=${CACHE.sheetGid}&tq=${encodeURIComponent(tq)}&tqx=out:json;responseHandler:${cb}`;
    const sc=document.createElement('script');
    const t=setTimeout(()=>{cleanup();rej('timeout');},6000);
    const cleanup=()=>{clearTimeout(t);sc.remove();delete window[cb];};
    window[cb]=data=>{
      cleanup();
      const rows=data?.table?.rows||[];
      if(!rows.length)return rej('nf');
      try{S.cacheAt=rows[0].c[1]?.v||'';res(JSON.parse(rows[0].c[0].v));}
      catch(e){rej(e);}
    };
    sc.onerror=()=>{cleanup();rej('err');};
    sc.src=url;document.head.appendChild(sc);
  });
}

/* ══════════════════════════════════════════
   CACHE — 多列讀取（dashboard）
══════════════════════════════════════════ */
function readCacheMulti(clientId){
  return new Promise((res,rej)=>{
    if(!CACHE.enabled||!CACHE.spreadsheetId||!CACHE.sheetGid)return rej('no cfg');
    const cb='ccm_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const tq=`select B,C,D,E where A='${clientId}' and (B='dashboard_meta' or B='dashboard_month')`;
    const url=`https://docs.google.com/spreadsheets/d/${CACHE.spreadsheetId}/gviz/tq?gid=${CACHE.sheetGid}&tq=${encodeURIComponent(tq)}&tqx=out:json;responseHandler:${cb}`;
    const sc=document.createElement('script');
    const t=setTimeout(()=>{cleanup();rej('timeout');},8000);
    const cleanup=()=>{clearTimeout(t);sc.remove();delete window[cb];};
    window[cb]=data=>{
      cleanup();
      const rows=data?.table?.rows||[];
      if(!rows.length)return rej('nf');
      try{
        let meta=null;const monthMap={};
        rows.forEach(r=>{
          const type=r.c[0]?.v||'';
          const json=JSON.parse(r.c[2]?.v||'{}');
          const at=r.c[3]?.v||'';
          if(type==='dashboard_meta'){meta=json;S.cacheAt=at;}
          else if(type==='dashboard_month'&&json.month){monthMap[json.month]=json;}
        });
        if(!meta)return rej('no meta');
        res({ok:true,source:meta.source||'',spreadsheetName:meta.spreadsheetName||'',cachedAt:meta.cachedAt||'',
          months:(meta.months||[]).map(m=>monthMap[m.month]||m)});
      }catch(e){rej(e);}
    };
    sc.onerror=()=>{cleanup();rej('err');};
    sc.src=url;document.head.appendChild(sc);
  });
}

/* ══════════════════════════════════════════
   FETCH2 — Cache 優先，失敗 fallback GAS
   注意：dashboard 走多列讀取；data（任務）永遠走 GAS（需要即時）
══════════════════════════════════════════ */
async function fetch2(type,action,params={}){
  if(type==='dashboard'){
    try{const d=await readCacheMulti(S.client);setCachePill(S.cacheAt,false);return d;}
    catch(_){const d=await gasAPI(action,params);setCachePill('',true);return d;}
  }
  try{const d=await readCache(type,S.client,params.month||'');setCachePill(S.cacheAt,false);return d;}
  catch(_){const d=await gasAPI(action,params);setCachePill('',true);return d;}
}

function setCachePill(at,live){
  const el=$('cachePill');if(!el)return;
  if(live){el.innerHTML='<div class="cpill stale"><div class="cdot"></div>Live</div>';return;}
  if(at){const m=Math.round((Date.now()-new Date(at))/60000);el.innerHTML=`<div class="cpill live"><div class="cdot"></div>Cache · ${m<1?'剛更新':m+'m 前'}</div>`;}
}

/* ══════════════════════════════════════════
   TASK STATE
══════════════════════════════════════════ */
function getDS(t){
  const s=t.status||'',vs=t.videoStatus||'',hv=!!t.videoLink,iv=S.type==='video';
  if(!iv){
    if(!s||s==='客戶尚未確認')return{g:'active',label:'待確認',cls:'b-need',e:'📝'};
    if(s==='客戶已回需修改')return{g:'passive',label:'修改中',cls:'b-mod',e:'✏️'};
    if(s==='修改完成，需確認')return{g:'active',label:'修改稿待確認',cls:'b-rev',e:'🔍'};
    if(s==='確認完畢')return{g:'done',label:'確認完畢',cls:'b-ok',e:'✅'};
  }else{
    if(!s||s==='客戶尚未確認')return{g:'active',label:'腳本待確認',cls:'b-need',e:'📝'};
    if(s==='客戶已回需修改')return{g:'passive',label:'腳本修改中',cls:'b-mod',e:'✏️'};
    if(s==='修改完成，需確認')return{g:'active',label:'修改稿待確認',cls:'b-rev',e:'🔍'};
    if(s==='確認完畢'){
      if(!hv&&(!vs||vs==='影片需確認'))return{g:'passive',label:'影片製作中',cls:'b-prog',e:'🎬'};
      if(vs==='影片需確認'&&hv)return{g:'active',label:'影片待確認',cls:'b-need',e:'🎥'};
      if(vs==='需修改')return{g:'passive',label:'影片修改中',cls:'b-mod',e:'🔧'};
      if(vs==='修改稿需確認')return{g:'active',label:'影片修改稿待確認',cls:'b-rev',e:'🔍'};
      if(vs==='確認完畢')return{g:'done',label:'全部完畢',cls:'b-ok',e:'✅'};
      return{g:'passive',label:'影片製作中',cls:'b-prog',e:'🎬'};
    }
  }
  return{g:'active',label:'待確認',cls:'b-need',e:'📝'};
}

══════════════════════════════════════════ */
function renderTasks(tasks,sheetName){
  const f=tasks.filter(t=>t.status?.trim());
  if(!f.length){$('taskList').innerHTML='<div class="empty">目前沒有待確認的任務</div>';return;}
  const active=[],passive=[],done=[];
  f.forEach((t,i)=>{const ds=getDS(t),o={t,ds,i,sheetName};ds.g==='done'?done.push(o):ds.g==='passive'?passive.push(o):active.push(o);});
  let out='';
  active.forEach(o=>out+=taskHTML(o.t,o.sheetName,'tk'+o.i,o.ds,true));
  passive.forEach(o=>out+=taskHTML(o.t,o.sheetName,'tk'+o.i,o.ds,false));
  if(done.length){out+='<div class="done-div">已確認完畢（可點開調整）</div>';done.forEach(o=>out+=taskHTML(o.t,o.sheetName,'tk'+o.i,o.ds,false));}
  $('taskList').innerHTML=out||'<div class="empty">所有任務都已確認完畢</div>';
  document.querySelectorAll('.task-card[data-ao]').forEach(el=>{el.classList.add('open');el.removeAttribute('data-ao');});
}

async function doSub(ev,id,sn,tid,kind){
  ev.stopPropagation();
  const btn=ev.target;btn.disabled=true;btn.textContent='送出中…';
  const p={client:S.client,type:S.type,sheetName:sn,taskId:tid,submitKind:kind};
  if(kind==='script'){p.status=$(`ss-${id}`).value;p.feedback=$(`sf-${id}`).value;}
  else{p.videoStatus=$(`vs-${id}`)?.value||'';p.videoFeedback=$(`vf-${id}`)?.value||'';}
  try{
    await gasAPI('submit',p);
    // 送出後清掉 dashboard cache，下次打開數據牆會重抓
    S.dashboard=null;S.dashReady=false;
    toast('✅ 已送出');
    // 就地更新 badge
    const card=document.getElementById(id);
    if(card){
      const ft={status:kind==='script'?p.status:s,videoStatus:kind==='video'?p.videoStatus:'',videoLink:card.querySelector('.vlink')?'y':''};
      const nd=getDS(ft);
      const bdg=card.querySelector('.bdg');if(bdg){bdg.className='bdg '+nd.cls;bdg.textContent=nd.label;}
      const ei=card.querySelector('.thead span:first-child');if(ei)ei.textContent=nd.e;
      if(nd.g==='done'){
        card.classList.remove('prio');card.classList.add('done-c');
        let dv=document.querySelector('.done-div');
        if(!dv){dv=document.createElement('div');dv.className='done-div';dv.textContent='已確認完畢（可點開調整）';$('taskList').appendChild(dv);}
        $('taskList').appendChild(card);card.classList.remove('open');
      }
    }
    btn.disabled=false;btn.textContent=kind==='script'?'送出腳本確認':'送出影片確認';
  }catch(e){
    toast('⚠️ 失敗：'+e.message);
    btn.disabled=false;btn.textContent=kind==='script'?'送出腳本確認':'送出影片確認';
  }
}

<div class="mini-head" onclick="tog('${mid}','mini-card')">
  <span class="tid">${h(t.taskId||'—')}</span>
  ${t.type?`<span class="bdg b-prog">${h(t.type)}</span>`:''}
  <span class="tgrow"></span>
  <span class="exp-n">${n(t.exposure||0)}</span>
  <span class="mc">›</span>
</div>
<div class="mini-body">
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start">
    ${imgs?`<div style="display:flex;gap:6px;flex-wrap:wrap">${imgs}</div>`:''}
    <div style="flex:1;min-width:140px">${scr}</div>
  </div>
  ${lnks?`<div class="mini-links">${lnks}</div>`:''}
</div>
</div>`;
      }).join('');

      return`<tr class="prod-row" onclick="togProd('${pid}')">
  <td><span class="rank ${rc}">${re}</span></td>
  <td><span class="ptag" title="${h(p.name)}">${h(p.name)}</span></td>
  <td style="color:var(--muted);font-family:var(--mono);font-size:11px">${p.tasks.length}</td>
  <td><div class="bar-bg"><div class="bar-fg" style="width:${bw}%"></div></div></td>
  <td><span class="exp-n">${n(p.tE)}</span></td>
  <td><span class="fee-n">${p.tF?'$'+n(p.tF):'—'}</span></td>
  <td style="color:var(--muted)">›</td>
</tr>
<tr class="pexp-tr" id="${pid}">
  <td colspan="7" class="pexp-td"><div class="mini-list">${minis}</div></td>
</tr>`;
    }).join('');

    return`<div class="month-block" id="mb${mi}">
<div class="mhead" onclick="tog('mb${mi}','month-block')">
  <div class="m-label">${h(m.month)}</div>
  <div class="mpills">
    <span class="mpill">曝光 <b>${n(m.totalExposure||0)}</b></span>
    ${m.totalFee?`<span class="mpill">收費 <b>$${n(m.totalFee)}</b></span>`:''}
    <span class="mpill">任務 <b>${m.taskCount||0}</b></span>
    <span class="mpill"><b>${prods.length}</b> 商品</span>
  </div>
  <span class="mchev">›</span>
</div>
<div class="mbody">
  <div class="pt-wrap">
    <table class="pt">
      <thead><tr><th>排名</th><th>商品</th><th>篇數</th><th>佔比</th><th>曝光</th><th>收費</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
</div>
</div>`;
  }).join('');

  document.querySelector('.month-block')?.classList.add('open');
}

/* ══════════════════════════════════════════
   BREADCRUMB
══════════════════════════════════════════ */
function crumbs(){
  const pts=[];
  if(S.clientName)pts.push({label:S.clientName,sub:'客戶首頁',fn:'goHome()'});
  if(S.month)pts.push({label:S.month,sub:'月份',fn:'goM()'});
  if(S.product)pts.push({label:S.product,sub:'商品',fn:'goP()'});
  if(S.type)pts.push({label:S.type==='thread'?'脆（Threads）':'影音',sub:'類型',fn:''});
  $('bc').innerHTML=pts.map((p,i)=>{
    const last=i===pts.length-1;
    const inner=`<small>${p.sub}</small><span>${h(p.label)}</span>`;
    if(last)return`<div class="crumb cur">${inner}</div>`;
    if(!p.fn)return`<div class="crumb">${inner}</div>`;
    return`<div class="crumb lnk" onclick="${p.fn}">${inner}</div>`;
  }).join('<span class="csep">›</span>');
}
function goHome(){safeNav(()=>loadMeta());}
function goM(){S.product='';S.type='';showOnly('sMonth');crumbs();}
function goP(){S.type='';showOnly('sType');crumbs();}

/* ══════════════════════════════════════════
   TOGGLE HELPERS
══════════════════════════════════════════ */
function tog(id,cls){document.getElementById(id)?.classList.toggle('open');}
function togProd(pid){
  const el=document.getElementById(pid);if(!el)return;
  const wasOpen=el.classList.contains('open');
  el.closest('tbody')?.querySelectorAll('.pexp-tr.open').forEach(r=>{if(r!==el)r.classList.remove('open');});
  el.closest('tbody')?.querySelectorAll('.prod-row.act').forEach(r=>r.classList.remove('act'));
  el.classList.toggle('open',!wasOpen);
  if(!wasOpen)el.previousElementSibling?.classList.add('act');
}
function expScr(id){const el=document.getElementById(id);if(el){el.classList.add('exp');el.nextElementSibling?.remove();}}

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
function imgt(url){
  url=String(url||'').trim();if(!url)return'';
  let src=url,m=url.match(/\/file\/d\/([^\/\?]+)/);
  if(!m)m=url.match(/[?&]id=([^&]+)/);
  if(m)src=`https://drive.google.com/thumbnail?id=${m[1]}&sz=w800`;
  else if(!url.includes('drive.google.com'))return'';
  return`<img class="img-th" src="${h(src)}" onclick="openLB('${esc(src)}')" loading="lazy">`;
}
function imgMini(url){
  url=String(url||'').trim();if(!url)return'';
  let src=url,m=url.match(/\/file\/d\/([^\/\?]+)/);
  if(!m)m=url.match(/[?&]id=([^&]+)/);
  if(m)src=`https://drive.google.com/thumbnail?id=${m[1]}&sz=w800`;
  else if(!url.includes('drive.google.com'))return'';
  return`<img class="mini-img" src="${h(src)}" onclick="openLB('${esc(src)}')" loading="lazy">`;
}
function vlinksH(raw){
  return String(raw||'').split(/[\n,]+/).map(s=>s.trim()).filter(s=>/^https?:\/\//i.test(s))
    .map((u,i,a)=>`<a class="vlink" href="${h(u)}" target="_blank" rel="noopener">▶️ ${a.length>1?'影片 '+(i+1):'開啟影片'}</a>`).join('');
}
function openLB(u){$('lbImg').src=u;$('lb').classList.add('show');}
function closeLB(){$('lb').classList.remove('show');}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function n(v){return Number(v||0).toLocaleString('zh-TW');}
function h(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function esc(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
